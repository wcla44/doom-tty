name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ github.ref_name }}

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        run: |
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft \
            --verify-tag \
            --title "$TAG" \
            --notes "$TAG builds: static x86_64 Linux (musl) and universal macOS (Apple Silicon + Intel).

          Bring your own IWAD: put \`doom1.wad\` in \`./wad/\` or run \`./doom -iwad path/to/doom1.wad\`."

  linux:
    needs: draft
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add "$TARGET"

      - name: Build
        # cc uses musl-gcc for the C engine; Rust links it statically
        run: cargo build --release --locked --target "$TARGET"

      - name: Check binary is static
        run: |
          BIN="target/$TARGET/release/doom"
          file "$BIN"
          file "$BIN" | grep -qE "static(-pie)? linked"

      - name: Package and upload
        run: |
          NAME="doom-tty-$TARGET"
          mkdir -p "dist/$NAME"
          cp "target/$TARGET/release/doom" LICENSE README.md "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" "dist/$NAME.tar.gz" "dist/$NAME.tar.gz.sha256"

  macos:
    needs: draft
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v5

      - name: Build arm64 and x86_64
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Make universal binary
        run: |
          mkdir -p dist
          lipo -create -output dist/doom \
            target/aarch64-apple-darwin/release/doom \
            target/x86_64-apple-darwin/release/doom
          lipo -info dist/doom
          # only system libraries
          otool -L dist/doom
          ! otool -L dist/doom | tail -n +2 | grep -vqE "^\s+/(usr/lib|System/Library)/"

      - name: Package and upload
        run: |
          NAME="doom-tty-universal-apple-darwin"
          mkdir -p "dist/$NAME"
          cp dist/doom LICENSE README.md "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" "dist/$NAME.tar.gz" "dist/$NAME.tar.gz.sha256"

  publish:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        run: gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest

  cleanup:
    # never leave a half-filled draft behind
    needs: [linux, macos]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Delete draft
        run: gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes
