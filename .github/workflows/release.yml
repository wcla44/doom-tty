name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  TARGET: x86_64-unknown-linux-musl
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add "$TARGET"

      - name: Build
        # cc uses musl-gcc for the C engine; Rust links it statically
        run: cargo build --release --locked --target "$TARGET"

      - name: Check binary is static
        run: |
          BIN="target/$TARGET/release/doom"
          file "$BIN"
          file "$BIN" | grep -qE "static(-pie)? linked"

      - name: Package
        run: |
          NAME="doom-tty-$TARGET"
          mkdir -p "dist/$NAME"
          cp "target/$TARGET/release/doom" LICENSE README.md "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          SHORT="${GITHUB_SHA::7}"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Build ${GITHUB_RUN_NUMBER} (${SHORT})" \
            --notes "Static x86_64 Linux (musl) build of ${GITHUB_SHA}.

          Bring your own IWAD: put \`doom1.wad\` in \`./wad/\` or run \`./doom -iwad path/to/doom1.wad\`." \
            --latest \
            dist/*.tar.gz dist/*.sha256
